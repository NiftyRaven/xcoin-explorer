<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XFER Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#/">
        <span class="mark">X</span>
        <span class="brand-text">
          <strong>XFER Explorer</strong>
          <em>blocks · assets · lottery</em>
        </span>

      <form class="search" id="search-form">
        <input id="q" type="search" placeholder="Search height, hash, address, asset, @handle" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div class="status-pills">
        <span class="pill" id="pill-rpc">node…</span>
        <span class="pill gold" id="pill-height">height —</span>
      </div>
    </header>
    <nav class="nav">
      <a href="#/">Home</a>
      <a href="#/blocks">Blocks</a>
      <a href="#/lottery">Lottery</a>
      <a href="#/members">Members</a>
      <a href="#/stats">Stats</a>
      <a href="#/assets">Assets</a>
      <a href="#/rich">Holders</a>
      <a href="#/mempool">Mempool</a>
      <a href="#/network">Network</a>
    </nav>
    <main id="app"><div class="loading">Loading explorer…</div></main>
    <footer class="foot">
      Local explorer for <a href="https://github.com/NiftyRaven/x-coin" target="_blank" rel="noreferrer">X Coin (XFER)</a>
      · one minute lottery among X Verified nodes · guest shares · native assets
      · <span id="foot-net"></span>
    </footer>
  </div>
  <script src="/static/js/app.js?v=pinata-view-1"></script>
